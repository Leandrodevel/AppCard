<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LP Cardápios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
//teste de github
  // 1. Configurações de acesso
  const SUPABASE_URL = 'https://wyhqwprshbgwjlnxndhm.supabase.co'
  
  const SUPABASE_KEY ='sb_publishable_avVe0cMnriaF8Ogt42Z7Xg_PTD5pdnZ'

  // 2. Inicializa o cliente
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Navbar Minimalista (Mantendo o padrão do sistema) -->
    <nav class="bg-white/80 backdrop-blur-md border-b">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-orange-600 p-2 rounded-lg">
                    <i data-lucide="layout-template" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight">LP <span class="text-orange-600">Cardápios</span></span>
            </div>
        </div>
    </nav>

    <!-- Container do Login -->
    <div class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white p-8 shadow-sm border border-gray-100">
            
            <div class="mb-8">
                <h1 class="text-2xl font-black text-gray-800 uppercase tracking-tight">Bem-vindo de volta</h1>
                <p class="text-gray-500 text-sm mt-1">Acesse sua conta para gerenciar seu cardápio.</p>
            </div>

            <form id="loginForm" onsubmit="fazerLogin(event)" class="space-y-6">
                <!-- E-mail -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1 tracking-widest">E-mail de Acesso</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3.5 text-gray-400 w-4 h-4"></i>
                        <input type="email" id="login_email" required placeholder="exemplo@gmail.com"
                            class="w-full bg-gray-50 border-none p-3 pl-10 text-sm focus:bg-gray-100 focus:ring-2 focus:ring-orange-500/20 outline-none transition-all">
                    </div>
                </div>

                <!-- Senha -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Sua Senha</label>
                        <a href="#" class="text-xs font-bold text-orange-600 uppercase hover:underline">Esqueci a senha</a>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3.5 text-gray-400 w-4 h-4"></i>
                        <input type="password" id="login_senha" required placeholder="••••••••"
                            class="w-full bg-gray-50 border-none p-3 pl-10 text-sm focus:bg-gray-100 focus:ring-2 focus:ring-orange-500/20 outline-none transition-all">
                    </div>
                </div>

                <!-- Botão de Entrar -->
                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-orange-600 text-white font-black py-4 uppercase tracking-[0.2em] text-xs transition-all hover:bg-orange-700 active:scale-[0.98]">
                        Entrar no Painel
                    </button>
                </div>
            </form>

            <!-- Rodapé do Card -->
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-500">
                    Ainda não tem uma conta? 
                    <a href="homePage.html" class="text-orange-600 font-bold hover:underline">Criar agora</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script> <!-- Aqui deve estar seu supabase inicializado -->
    <script>
        // Inicializa ícones Lucide
        lucide.createIcons();

        async function fazerLogin(event) {
            event.preventDefault();

            const email = document.getElementById('login_email').value;
            const senha = document.getElementById('login_senha').value;

            try {
                // Chama o Auth do Supabase
                // Se no seu config.js a variável for '_supabase', mude aqui
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: senha,
                });

                if (error) throw error;

                // Sucesso: Redireciona para o Dashboard (Home.html)
                console.log("Login realizado:", data);
                window.location.href = 'index.html';

            } catch (error) {
                alert("Erro ao entrar: " + (error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message));
                console.error(error);
            }
        }
    </script>
</body>
</html>
