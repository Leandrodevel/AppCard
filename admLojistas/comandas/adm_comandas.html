<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP Comanda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans pb-20">

<header id="header" class="bg-white border-b border-gray-100 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3">
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
      <!-- Logo -->
      <div class="flex items-center gap-2">
        <div class="bg-orange-600 p-1.5 rounded-lg">
          <i data-lucide="layout-template" class="text-white w-5 h-5"></i>
        </div>
        <span class="text-xl font-black tracking-tight text-slate-800">
            LP <span class="text-orange-600">Cardápios</span>
        </span>
      </div>

      <!-- Menu de Navegação -->
      <div class="flex items-center justify-center gap-1 sm:gap-4 w-full md:w-auto">
        <button onclick="window.location.href='../admin.html'" class="flex flex-col items-center justify-center flex-1 md:flex-none px-3 py-1 text-gray-500 hover:text-orange-600 transition-all border-b-2 border-transparent hover:border-orange-600">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-[9px] font-bold uppercase mt-1">Painel</span>
        </button>
        <button onclick="window.location.href='../admin.html#produtos'" class="flex flex-col items-center justify-center flex-1 md:flex-none px-3 py-1 text-gray-500 hover:text-orange-600 transition-all border-b-2 border-transparent hover:border-orange-600">
          <i data-lucide="package" class="w-5 h-5"></i>
          <span class="text-[9px] font-bold uppercase mt-1">Produtos</span>
        </button>
        <button class="flex flex-col items-center justify-center flex-1 md:flex-none px-3 py-1 text-orange-600 border-b-2 border-orange-600 transition-all">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          <span class="text-[9px] font-bold uppercase mt-1">Comandas</span>
        </button>
        <button onclick="handleLogout()" class="flex flex-col items-center justify-center flex-1 md:flex-none px-3 py-1 text-gray-400 hover:text-red-500 transition-all">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span class="text-[9px] font-bold uppercase mt-1">Sair</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Seção Principal (Removido o 'hidden' para carregar direto) -->
<section id="main-section" class="p-4 max-w-2xl mx-auto">
    <div class="mb-6 mt-4">
        <button onclick="novoCliente()" class="w-full flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl transition shadow-lg active:scale-95">
            <i class="fas fa-plus-circle"></i> Abrir Nova Comanda
        </button>
    </div>

    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-black text-gray-800">Comandas Ativas</h2>
        <span id="contador-comandas" class="bg-gray-200 text-gray-600 text-xs font-bold px-2 py-1 rounded-md">0</span>
    </div>

    <div id="lista-cards" class="space-y-4">
        <!-- Cards entram aqui -->
    </div>
</section>

<!-- Modal de Opções -->
<div id="modal-opcoes" class="fixed inset-0 bg-black/60 hidden items-end sm:items-center justify-center z-50 p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up">
        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
        <h3 class="text-xl font-black mb-6 text-center text-gray-800">Gerenciar Comanda</h3>
        <div class="grid grid-cols-1 gap-3">
            <button onclick="adicionarItem()" class="flex items-center justify-center gap-3 bg-blue-50 text-blue-700 font-bold py-4 rounded-2xl hover:bg-blue-100 transition active:scale-95">
                <i class="fas fa-cart-plus"></i> Lançar Item
            </button>
            <button onclick="fecharComanda()" class="flex items-center justify-center gap-3 bg-green-600 text-white font-bold py-4 rounded-2xl hover:bg-green-700 transition shadow-md active:scale-95">
                <i class="fas fa-check-double"></i> Finalizar e Pagar
            </button>
            <button onclick="fecharModal()" class="mt-4 text-gray-400 font-bold py-2 uppercase text-xs tracking-widest">Voltar</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://wyhqwprshbgwjlnxndhm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_avVe0cMnriaF8Ogt42Z7Xg_PTD5pdnZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let clienteAtivoId = null;
    let idLojaAtiva = null;

  async function carregarUsuario() {
    try {
        // Trocamos o .single() por .select() simples para testar a conexão
        const { data: lojas, error } = await _supabase
            .from('lojas')
            .select('*');

        if (error) {
            console.error("Erro na requisição Supabase:", error.message);
            // Se der erro 406 aqui, é provável que o RLS precise de uma política de leitura (SELECT)
            return;
        }

        if (!lojas || lojas.length === 0) {
            console.warn("Nenhuma loja cadastrada na tabela 'lojas'.");
            return;
        }

        // Pegamos a primeira loja encontrada
        const adm = lojas[0];
        idLojaAtiva = adm.id;
        
        console.log("Loja identificada com sucesso:", adm.adm_nome, "ID:", idLojaAtiva);
        
        // Agora carregamos as comandas
        carregarComandasDoBanco(idLojaAtiva);

    } catch (err) {
        console.error("Erro inesperado no sistema:", err);
    }
}

    async function carregarComandasDoBanco(id_user) {

        if (!id_user) return;

        const { data: comandas, error } = await _supabase
            .from('comandas')
            .select(`*, itens_comanda (*)`)
            .eq('id_comercial', id_user)
            .order('id', { ascending: false });

        if (error) return console.error("Erro:", error);

        const listaCards = document.getElementById('lista-cards');
        document.getElementById('contador-comandas').innerText = comandas.length;
        listaCards.innerHTML = ''; 
        if(comandas.length === 0) {
            listaCards.innerHTML = `<div class="text-center py-10 text-gray-400 italic text-sm">Nenhuma comanda aberta no momento.</div>`;
        }

        comandas.forEach(comanda => {
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-2xl shadow-sm border-l-4 border-orange-500 active:scale-95 transition-all mb-3 cursor-pointer";
            card.onclick = () => abrirModalOpcoes(comanda.id);

            const itensHtml = comanda.itens_comanda.slice(0, 3).map(item => `
                <div class="flex justify-between text-[11px] text-gray-500 py-1 border-b border-gray-50">
                    <span>${item.descricao}</span>
                    <span class="font-bold">R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}</span>
                </div>
            `).join('');

            const resto = comanda.itens_comanda.length - 3;

            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h3 class="text-base font-black text-gray-800">${comanda.cliente_nome}</h3>
                        <p class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">Comanda Aberta</p>
                    </div>
                    <div class="bg-green-50 px-3 py-1 rounded-lg text-right">
                        <p class="text-sm font-black text-green-600 text-[15px]">R$ ${parseFloat(comanda.total || 0).toFixed(2).replace('.', ',')}</p>
                    </div>
                </div>
                <div class="space-y-0.5">${itensHtml || '<p class="text-[10px] italic text-gray-300">Vazia</p>'}</div>
                ${resto > 0 ? `<p class="text-[10px] text-orange-500 font-bold mt-1">+ ${resto} itens...</p>` : ''}
            `;
            listaCards.appendChild(card);
        });
    }

    async function novoCliente() {
        const nome = prompt("Nome do Cliente / Mesa:");
        if (!nome || !idLojaAtiva) return;

        const { error } = await _supabase
            .from('comandas')
            .insert([{ 
                cliente_nome: nome, 
                total: 0,
                id_comercial: idLojaAtiva // Vincula à loja logada
            }]);

        if (error) alert("Erro: " + error.message);
        else carregarComandasDoBanco(idLojaAtiva);
    }

    async function adicionarItem() {
        fecharModal();
        const desc = prompt("Item (ex: Cerveja 600ml):");
        if (!desc) return;
        const valorStr = prompt("Preço (ex: 12,50):");
        const valor = parseFloat(valorStr?.replace(',', '.'));

        if (isNaN(valor)) return alert("Valor inválido");

        // Insere item
        await _supabase.from('itens_comanda').insert([{ comanda_id: clienteAtivoId, descricao: desc, preco: valor }]);
        
        // Atualiza total da comanda
        const { data: c } = await _supabase.from('comandas').select('total').eq('id', clienteAtivoId).single();
        const novoTotal = (parseFloat(c.total) || 0) + valor;
        await _supabase.from('comandas').update({ total: novoTotal }).eq('id', clienteAtivoId);
        
        carregarComandasDoBanco(idLojaAtiva);
    }

    async function fecharComanda() {
        if (!confirm("Confirmar pagamento e fechar comanda?")) return;
        // Aqui você pode mudar para UPDATE status='pago' se quiser manter histórico
        await _supabase.from('comandas').delete().eq('id', clienteAtivoId);
        fecharModal();
        carregarComandasDoBanco(idLojaAtiva);
    }

    function abrirModalOpcoes(id) {
        clienteAtivoId = id;
        document.getElementById('modal-opcoes').classList.replace('hidden', 'flex');
    }

    function fecharModal() {
        document.getElementById('modal-opcoes').classList.replace('flex', 'hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
        carregarUsuario();
        lucide.createIcons();
    });
</script>

<style>
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</body>
</html>
