</div>
            <!-- Gestão de Horários -->
            <div>
                <h3 class="text-sm font-black text-gray-800 mb-4 flex items-center gap-2">

                    HORÁRIOS DE FUNCIONAMENTO

    <script>
        // Array com os nomes das fotos que você já tem na sua pasta /assets/produtos/
const bancoDeFotos = [
    "churrasco.jpg", "cerveja.jpg", "pao-alho.jpg", "combo-1.jpg", 
    "refrigerante.jpg", "espetinho.jpg", "vinagrete.jpg", "porcao.jpg",
    "batata-frita.jpg", "suco.jpg"
];

function renderizarGaleria() {
    const galeria = document.getElementById('galeria-fotos');
    galeria.innerHTML = "";

    bancoDeFotos.forEach(foto => {
        galeria.innerHTML += `
            <div onclick="selecionarFoto(this, '${foto}')" 
                 class="relative aspect-square rounded-2xl overflow-hidden cursor-pointer border-4 border-transparent hover:border-orange-200 transition-all group">
                <img src="../img/${foto}" class="w-full h-full object-cover group-hover:scale-110 transition-transform">
                <div class="overlay-check hidden absolute inset-0 bg-orange-600/40 flex items-center justify-center">
                    <i data-lucide="check" class="text-white w-6 h-6"></i>
                </div>
            </div>
        `;
    });
    lucide.createIcons();
}
renderizarGaleria();
function selecionarFoto(elemento, nomeFoto) {
    // 1. Remove destaques anteriores
    const todos = document.querySelectorAll('#galeria-fotos > div');
    todos.forEach(div => {
        div.classList.replace('border-orange-500', 'border-transparent');
        div.querySelector('.overlay-check').classList.add('hidden');
    });

    // 2. Destaca a foto atual
    elemento.classList.replace('border-transparent', 'border-orange-500');
    elemento.querySelector('.overlay-check').classList.remove('hidden');

    // 3. Salva o nome nos campos de controle
    document.getElementById('prod-foto-nome').value = nomeFoto;
    document.getElementById('foto-selecionada-nome').innerText = nomeFoto;
}

// 4. Integração no Salvar Produto
async function salvarNovoProduto() {
    const nomeFoto = document.getElementById('prod-foto-nome').value;

    const produto = {
        id_comercial: idLojaAtiva,

    const { error } = await _supabase.from('produtos').insert([produto]);
    
    if(!error) {

}
        // O JSON que você enviou
        let dadosAtuais = null;

        async function carregarDadosIniciais() {
            // Aqui você faria o fetch do Supabase usando o ID: 76e33437...
            // Por enquanto, usaremos o objeto que você colou:
            const response = {"idx":0,"id":"76e33437-1a51-4f6f-a058-35a7ab784784","nome_comercio":"Budega Grill e Bebidas","slug":"budegagrillebebidas","whatsapp":"22998052702","endereco_completo":"Rua Nazário Pereira Gomes ","horarios_funcionamento":"{\"dom\": {\"saida\": \"\", \"aberto\": false, \"entrada\": \"\", \"horario\": \"Fechado\"}, \"qua\": {\"saida\": \"22:00\", \"aberto\": true, \"entrada\": \"08:00\", \"horario\": \"08:00 às 22:00\"}, \"qui\": {\"saida\": \"22:00\", \"aberto\": true, \"entrada\": \"08:00\", \"horario\": \"08:00 às 22:00\"}, \"sab\": {\"saida\": \"22:00\", \"aberto\": true, \"entrada\": \"08:00\", \"horario\": \"08:00 às 22:00\"}, \"seg\": {\"saida\": \"22:00\", \"aberto\": true, \"entrada\": \"08:00\", \"horario\": \"08:00 às 22:00\"}, \"sex\": {\"saida\": \"22:00\", \"aberto\": true, \"entrada\": \"08:00\", \"horario\": \"08:00 às 22:00\"}, \"ter\": {\"saida\": \"22:00\", \"aberto\": true, \"entrada\": \"08:00\", \"horario\": \"08:00 às 22:00\"}}"};

            dadosAtuais = response;
            preencherFormulario(response);
        }

        function preencherFormulario(data) {
            document.getElementById('nome_comercio').value = data.nome_comercio;
            document.getElementById('endereco_completo').value = data.endereco_completo;
            document.getElementById('whatsapp').value = data.whatsapp;
            document.getElementById('slug').value = data.slug;

            const horarios = JSON.parse(data.horarios_funcionamento);
            const container = document.getElementById('container-horarios');
            const diasNome = { seg: "Segunda", ter: "Terça", qua: "Quarta", qui: "Quinta", sex: "Sexta", sab: "Sábado", dom: "Domingo" };

            container.innerHTML = "";
            Object.keys(diasNome).forEach(dia => {
                const h = horarios[dia];
                container.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-2xl border border-gray-100">
                        <span class="text-xs font-bold text-gray-500 w-16">${diasNome[dia]}</span>
                        <div class="flex items-center gap-2">
                            <input type="time" id="abertura-${dia}" value="${h.entrada}" ${!h.aberto ? 'disabled' : ''} class="bg-white p-1 rounded-md text-xs border-none outline-none">
                            <span class="text-gray-300">às</span>
                            <input type="time" id="fechamento-${dia}" value="${h.saida}" ${!h.aberto ? 'disabled' : ''} class="bg-white p-1 rounded-md text-xs border-none outline-none">
                        </div>
                        <input type="checkbox" id="check-${dia}" ${h.aberto ? 'checked' : ''} onchange="toggleDia('${dia}')" class="w-5 h-5 accent-orange-600">
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function toggleDia(dia) {
            const check = document.getElementById(`check-${dia}`).checked;
            document.getElementById(`abertura-${dia}`).disabled = !check;
            document.getElementById(`fechamento-${dia}`).disabled = !check;
        }

        async function atualizarLoja() {
            // 1. Coletar Horários Novos
            const dias = ['seg', 'ter', 'qua', 'qui', 'sex', 'sab', 'dom'];
            let novoHorarioObj = {};

            dias.forEach(dia => {
                const aberto = document.getElementById(`check-${dia}`).checked;
                const ent = document.getElementById(`abertura-${dia}`).value;
                const sai = document.getElementById(`fechamento-${dia}`).value;
                novoHorarioObj[dia] = {
                    aberto: aberto,
                    entrada: ent,
                    saida: sai,
                    horario: aberto ? `${ent} às ${sai}` : "Fechado"
                };
            });

            // 2. Montar Objeto para o Supabase
            const updates = {
                nome_comercio: document.getElementById('nome_comercio').value,
                endereco_completo: document.getElementById('endereco_completo').value,
                whatsapp: document.getElementById('whatsapp').value,
                horarios_funcionamento: JSON.stringify(novoHorarioObj)
            };

            console.log("Enviando para o Supabase:", updates);

            // Chamada real:
            // const { error } = await _supabase.from('lojas').update(updates).eq('id', dadosAtuais.id);
            
            alert("Dados da Budega atualizados com sucesso!");
        }

        document.addEventListener('DOMContentLoaded', carregarDadosIniciais);
    </script>
