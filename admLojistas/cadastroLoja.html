<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Loja - Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50">

    <!-- Navegação -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-orange-600 p-2 rounded-lg">
                    <i data-lucide="layout-template" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight">LP <span class="text-orange-600">Cardápios</span></span>
            </div>
            <div class="hidden md:flex items-center gap-8 font-semibold text-slate-600">
              <h2 class="text-2xl font-bold mb-6 text-gray-800">Cadastrar Minha Loja</h2> </div>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto  p-8 ">
     
        
        <form id="formCadastroLoja" class="space-y-6 grid grid-cols-1">
            
            <div class="grid grid-cols-1  gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome do Comércio</label>
                    <input type="text" id="nome_comercio" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-orange-500 focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Link da Loja (Slug)</label>
                    <input type="text" id="slug" placeholder="ex: budega-do-joao" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-orange-500 focus:border-orange-500">
                </div>
            </div>

            <div class="grid grid-cols-1  gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">WhatsApp (com DDD)</label>
                    <input type="text" id="whatsapp" placeholder="21999999999" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                </div>
                <div >
                    <label class="block text-sm font-medium text-gray-700">Tema</label>
                 
                 
                 
                 
                 <div class=" p-6 rounded-2xl shadow-sm border border-gray-100">
    <label class="block text-xs font-bold text-gray-500 mb-4 uppercase tracking-widest">
        Selecione o Visual:
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
        
          <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-amarelo-escuro" class="peer sr-only">
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #FFD100;"></div>
                    <div class="w-1/2" style="background-color: #121212;"></div>
                </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600">
                    Amarelo Dark
                </div>
            </div>
        </label>

        <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-amarelo-claro" class="peer sr-only" checked>
            
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #FFD100;"></div> <div class="w-1/2" style="background-color: #F5F7F8;"></div> </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600 peer-checked:bg-blue-600 peer-checked:text-white transition-colors">
                    Amarelo
                </div>
            </div>
        </label>

        <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-acai-escuro" class="peer sr-only">
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #975cc2;"></div>
                    <div class="w-1/2" style="background-color: #0f0a14;"></div>
                </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600">
                    Açaí Noturno
                </div>
            </div>
        </label>

        <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-verde-claro" class="peer sr-only">
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #27AE60;"></div>
                    <div class="w-1/2" style="background-color: #F5F8F6;"></div>
                </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600">
                    Verde Soft
                </div>
            </div>
        </label>

        <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-laranja-escuro" class="peer sr-only">
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #FF8C00;"></div>
                    <div class="w-1/2" style="background-color: #121212;"></div>
                </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600">
                    Laranja Dark
                </div>
            </div>
        </label>

        <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-azul-claro" class="peer sr-only">
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #1976D2;"></div>
                    <div class="w-1/2" style="background-color: #F4F8FB;"></div>
                </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600">
                    Azul Sky
                </div>
            </div>
        </label>

        <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-vermelho-escuro" class="peer sr-only">
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #FF4D4D;"></div>
                    <div class="w-1/2" style="background-color: #121212;"></div>
                </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600">
                    Vermelho Dark
                </div>
            </div>
        </label>
         <label class="relative cursor-pointer group">
            <input type="radio" name="tema_comercio" value="tema-vermelho-claro" class="peer sr-only">
            <div class="overflow-hidden rounded-lg border-2 border-gray-200 peer-checked:border-blue-600 peer-checked:ring-2 peer-checked:ring-blue-100 transition-all">
                <div class="flex h-10 w-full">
                    <div class="w-1/2" style="background-color: #FF4D4D;"></div>
                    <div class="w-1/2" style="background-color: #F4F8FB;"></div>
                </div>
                <div class="bg-white py-1 px-2 text-[10px] font-bold text-center uppercase text-gray-600">
                    Vermelho Claro
                </div>
            </div>
        </label>
    </div>
</div>

                 
                 
                </div>
          <div class="max-w-md bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
    <!-- Título -->
    <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider mb-5 border-b pb-2">
        Horário de Funcionamento
    </h2>

    <div class="space-y-4">
        <!-- Segunda -->
        <div class="flex items-center gap-4">
            <input type="checkbox" name="seg_aberto" checked class="w-4 h-4 rounded text-blue-600 border-gray-300">
            <span class="w-10 text-xs font-bold text-gray-500">SEG</span>
            <div class="flex items-center gap-3 flex-1">
                <input type="time" name="seg_ini" value="08:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
                <span class="text-gray-400">→</span>
                <input type="time" name="seg_fim" value="18:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
            </div>
        </div>

        <!-- Terça -->
        <div class="flex items-center gap-4">
            <input type="checkbox" name="ter_aberto" checked class="w-4 h-4 rounded text-blue-600 border-gray-300">
            <span class="w-10 text-xs font-bold text-gray-500">TER</span>
            <div class="flex items-center gap-3 flex-1">
                <input type="time" name="ter_ini" value="08:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
                <span class="text-gray-400">→</span>
                <input type="time" name="ter_fim" value="18:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
            </div>
        </div>

        <!-- Quarta -->
        <div class="flex items-center gap-4">
            <input type="checkbox" name="qua_aberto" checked class="w-4 h-4 rounded text-blue-600 border-gray-300">
            <span class="w-10 text-xs font-bold text-gray-500">QUA</span>
            <div class="flex items-center gap-3 flex-1">
                <input type="time" name="qua_ini" value="08:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
                <span class="text-gray-400">→</span>
                <input type="time" name="qua_fim" value="18:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
            </div>
        </div>

        <!-- Quinta -->
        <div class="flex items-center gap-4">
            <input type="checkbox" name="qui_aberto" checked class="w-4 h-4 rounded text-blue-600 border-gray-300">
            <span class="w-10 text-xs font-bold text-gray-500">QUI</span>
            <div class="flex items-center gap-3 flex-1">
                <input type="time" name="qui_ini" value="08:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
                <span class="text-gray-400">→</span>
                <input type="time" name="qui_fim" value="18:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
            </div>
        </div>

        <!-- Sexta -->
        <div class="flex items-center gap-4">
            <input type="checkbox" name="sex_aberto" checked class="w-4 h-4 rounded text-blue-600 border-gray-300">
            <span class="w-10 text-xs font-bold text-gray-500">SEX</span>
            <div class="flex items-center gap-3 flex-1">
                <input type="time" name="sex_ini" value="08:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
                <span class="text-gray-400">→</span>
                <input type="time" name="sex_fim" value="18:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
            </div>
        </div>

        <!-- Sábado -->
        <div class="flex items-center gap-4">
            <input type="checkbox" name="sab_aberto" checked class="w-4 h-4 rounded text-blue-600 border-gray-300">
            <span class="w-10 text-xs font-bold text-gray-500">SAB</span>
            <div class="flex items-center gap-3 flex-1">
                <input type="time" name="sab_ini" value="08:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
                <span class="text-gray-400">→</span>
                <input type="time" name="sab_fim" value="12:00" class="w-full text-sm border-b border-gray-200 focus:border-blue-500 outline-none bg-transparent pb-1">
            </div>
        </div>

        <!-- Domingo -->
        <div class="flex items-center gap-4 opacity-50">
            <input type="checkbox" name="dom_aberto" class="w-4 h-4 rounded text-red-600 border-gray-300">
            <span class="w-10 text-xs font-bold text-gray-400">DOM</span>
            <div class="flex items-center gap-3 flex-1">
                <input type="time" name="dom_ini" class="w-full text-sm border-b border-gray-200 outline-none bg-transparent pb-1">
                <span class="text-gray-300">→</span>
                <input type="time" name="dom_fim" class="w-full text-sm border-b border-gray-200 outline-none bg-transparent pb-1">
            </div>
        </div>
    </div>
</div>

            <hr>

            <div class="space-y-4">
                <h3 class="font-semibold text-gray-700">Localização</h3>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Endereço Completo</label>
                    <input type="text" id="endereco_completo" placeholder="Rua, número, bairro..." class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cidade</label>
                    <input type="text" id="cidade" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                </div>
            </div>

            <hr>

            <div class="space-y-4">
                <h3 class="font-semibold text-gray-700">Redes Sociais</h3>
                <div class="grid grid-cols-1  gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Instagram (Link)</label>
                        <input type="url" id="instagram_url" placeholder="https://instagram.com/..." class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Facebook (Link)</label>
                        <input type="url" id="facebook_url" class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm">
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-orange-600 text-white font-bold py-3 rounded-lg hover:bg-orange-700 transition duration-300">
                    Cadastrar Minha Loja
                </button>
            </div>
        </form>
    </div>
  </div>
<script src="config.js" type="text/javascript" charset="utf-8">
  
</script>

</body>
</html>
