}

  async function criaProduto(produto) {
    const { data, error } = await _supabase
      .from('estoque')

    } else {

  async function novaEmbalagem(eqId,dados) {
    const { data, error } = await _supabase

      .update({embalagens:dados})

    if (error) {

  async function apagaProduto(eqId) {
  // Adicionamos .select() para que o 'data' contenha o item deletado
  const { data, error } = await _supabase
    .from('estoque')
    .delete()
    .eq('id', eqId)
    .select(); 

  if (error) {
    console.error('Erro ao deletar:', error.message);
    alert('Não foi possível excluir o produto.');
  } else {
    console.log('Produto deletado com sucesso:', data);
    // Só renderiza novamente se a exclusão foi confirmada
    renderizarAdmin();
  }
}

  async function obterDados() {

    .from('estoque')
    .select('*') // O asterisco traz todas as colunas
    .eq('id_comercial', id_comercio)
  if (error) {
    console.error('Erro ao ler dados:', error.message);
  } else {
    
    return data || []

<script>
function definirFiltro(filtro) {

  
  const sectionsProdutos = ['listaAdmin', 'combosParaMontar','cadastroCombo'];
 
    sectionsProdutos.forEach(element => {
       document.getElementById(element).classList.add('hidden');
    });
  document.getElementById(filtro).classList.remove('hidden');


  switch(filtro) {
    case 'listaAdmin':
      // Lógica para mostrar apenas itens de prateleira
      renderizarAdmin();
      break;
    case 'combosParaMontar':
     renderizarCombosParaMontar();
      break;

      case 'cadastroCombo':
      renderizarCadastroCombo();
      break;

    default:
      // Lógica para mostrar todos os itens
      renderizarAdmin();
  }
}
</script>
